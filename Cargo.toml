[package]
name = "smartaudio"
version = "0.3.0"
edition = "2021"
rust-version = "1.81.0"

description = "A `no_std` Rust library for parsing the TBS smartaudio protocol"
categories = [
  "embedded",
  "no-std",
  "aerospace::drones",
  "aerospace::unmanned-aerial-vehicles",
]
keywords = ["smartaudio", "vtx", "embedded", "no-std", "parser"]
authors = ["Nickolai Novik <nickolainovik@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/jettify/smartaudio"
repository = "https://github.com/jettify/smartaudio"
documentation = "https://docs.rs/smartaudio"
readme = "README.md"
include = [
  "src/**",
  "examples/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "Cargo.toml",
]

[dependencies]
defmt = { version = "1.0.1", optional = true }

[features]
defmt = ["dep:defmt"]

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "deny"
todo = "warn"
exit = "deny"
try_err = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
must_use_candidate = "allow"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "warn"
infinite_loop = "warn"
map_err_ignore = "deny"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
undocumented_unsafe_blocks = "deny"
string_slice = "warn"
unneeded_field_pattern = "warn"
missing_assert_message = "warn"
redundant_type_annotations = "warn"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
